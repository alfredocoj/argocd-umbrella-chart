name: Demo CI (tests + semgrep)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ feature/** ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r demos/openapi/requirements.txt
      - name: Run pytest
        run: pytest -q demos/openapi/tests

  semgrep:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep.yml
