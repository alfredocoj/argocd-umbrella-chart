name: Demo CI (tests + semgrep)

on:
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r demos/openapi/requirements.txt
          pip install -r demos/openapi/requirements-dev.txt
      - name: Run pip audit
        run: pip-audit --desc
      - name: Check Python formatting with Ruff
        run: ruff format --config demos/openapi/pyproject.toml --check demos/openapi
      - name: Lint with Ruff
        run: ruff check --config demos/openapi/pyproject.toml demos/openapi
      - name: Scan for secrets
        run: detect-secrets scan demos/openapi
      - name: Run pytest with coverage
        run: pytest -q demos/openapi/tests --cov=demos/openapi --cov-report=term-missing --cov-fail-under=80

  semgrep:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: demos/openapi/.semgrep.yml
  
  build-and-push:
    needs: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: demos/openapi/Dockerfile
          push: false
          tags: alfredocoj/api-rest-demo:latest
          outputs: type=docker,dest=/tmp/image.tar
      - name: Load image for scanning
        run: |
          docker load --input /tmp/image.tar
      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}":/workspace \
            aquasec/trivy:latest image \
            --format sarif \
            --output /workspace/trivy-results.sarif \
            --skip-files demos/openapi/README.md \
            alfredocoj/api-rest-demo:latest
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-results.sarif
      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: demos/openapi/Dockerfile
          push: true
          tags: alfredocoj/api-rest-demo:latest

